spring:
  application:
    name: uc-ecommerce
  datasource:
    url: jdbc:h2:mem:uc_ecommerce;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

uc:
  order:
    timeout-minutes: 5   # 订单超时（分钟），改小到 1 可快速演示超时关单
